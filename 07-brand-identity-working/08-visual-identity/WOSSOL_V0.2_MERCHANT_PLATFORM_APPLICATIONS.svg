<rect x="840" y="2440" width="720" height="555" rx="20" class="card"/><text x="876" y="2490" class="tiny muted">INVENTORY</text><text x="876" y="2540" class="h2 ink">Stock visibility</text><rect x="876" y="2570" width="648" height="70" rx="10" class="soft"/><text x="898" y="2614" class="small ink">Available · Expected · Demand</text><text x="876" y="2690" class="h3 ink">Review queues</text><text x="876" y="2730" class="small muted">Needs action · Out of stock</text><text x="876" y="2765" class="small muted">Orders waiting for stock · Inbound</text><text x="876" y="2800" class="small muted">Data issues · freshness</text><rect x="876" y="2840" width="648" height="95" rx="12" fill="#FCE9E3"/><text x="900" y="2880" class="small ink">Expected stock ≠ available stock.</text><text x="900" y="2912" class="small muted">Availability may be unknown; inspect data quality.</text>
