<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="#f4f4f2"/><g font-family="sans-serif" fill="#151515"><text x="36" y="45" font-size="25">V1.8 / DUAL APERTURE — SCALE &amp; RTL STRESS</text><text x="36" y="75" font-size="15">Experimental only. Arabic uses a fallback system font, not the V1.0 outlined master.</text></g><rect x="36" y="100" width="888" height="140" fill="white"/><g fill="#151515" font-family="sans-serif"><text x="58" y="135" font-size="16">36px</text><text x="178" y="135" font-size="16">72px</text><text x="380" y="135" font-size="16">144px</text></g><rect x="60" y="158" width="36" height="36" rx="6" fill="#151515"/><g transform="translate(63 170) scale(.19)" fill="#fff" fill-rule="evenodd"><path d="M143 48 H174 L188 61 V86 L174 100 H143 L129 86 V62 Z M149 61 L142 68 V81 L149 88 H168 L175 81 V67 L169 61 Z"/><path transform="translate(63)" d="M143 48 H174 L188 61 V86 L174 100 H143 L129 86 V62 Z M149 61 L142 68 V81 L149 88 H168 L175 81 V67 L169 61 Z"/></g><rect x="185" y="150" width="72" height="72" rx="12" fill="#151515"/><g transform="translate(190 174) scale(.41)" fill="#fff" fill-rule="evenodd"><path d="M143 48 H174 L188 61 V86 L174 100 H143 L129 86 V62 Z M149 61 L142 68 V81 L149 88 H168 L175 81 V67 L169 61 Z"/><path transform="translate(63)" d="M143 48 H174 L188 61 V86 L174 100 H143 L129 86 V62 Z M149 61 L142 68 V81 L149 88 H168 L175 81 V67 L169 61 Z"/></g><rect x="390" y="116" width="116" height="116" rx="18" fill="#151515"/><g transform="translate(399 157) scale(.66)" fill="#fff" fill-rule="evenodd"><path d="M143 48 H174 L188 61 V86 L174 100 H143 L129 86 V62 Z M149 61 L142 68 V81 L149 88 H168 L175 81 V67 L169 61 Z"/><path transform="translate(63)" d="M143 48 H174 L188 61 V86 L174 100 H143 L129 86 V62 Z M149 61 L142 68 V81 L149 88 H168 L175 81 V67 L169 61 Z"/></g><rect x="36" y="264" width="888" height="250" fill="#151515"/><g fill="#fff" font-family="sans-serif"><text x="62" y="300" font-size="16">English lockup (schematic)</text><text x="62" y="375" font-size="51" font-weight="bold">WOSSOL</text><text x="900" y="300" font-size="16" text-anchor="end">تركيب عربي تجريبي</text><text x="900" y="380" font-size="64" text-anchor="end" direction="rtl" unicode-bidi="plaintext">وصول</text><text x="62" y="485" font-size="17">Compact glyph and both scripts lack a demonstrated shared identity.</text></g><g fill="#151515" font-family="sans-serif"><text x="36" y="551" font-size="19">Decision: REJECT compact paired-O as brand icon; archive as experiment.</text></g></svg>