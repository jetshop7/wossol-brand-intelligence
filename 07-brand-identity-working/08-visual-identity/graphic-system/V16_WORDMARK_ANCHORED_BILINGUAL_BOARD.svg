<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780"><rect width="1200" height="780" fill="#f7f7f5"/><g font-family="sans-serif" fill="#171717"><text x="44" y="56" font-size="30" font-weight="bold">WOSSOL / V1.6 — distinctive signature gate</text><text x="44" y="85" font-size="16">Schematic research board — not an approved logo</text></g><rect x="44" y="125" width="535" height="470" fill="#fff"/><rect x="607" y="125" width="549" height="470" fill="#1b1b1b"/><g font-family="sans-serif"><text x="72" y="170" font-size="20" fill="#171717">01 / WORDMARK AS ANCHOR</text><text x="72" y="235" font-size="55" font-weight="bold" fill="#171717">WOSSOL</text><text x="72" y="284" font-size="22" fill="#171717">No extra geometric mascot</text><path d="M72 320H544" stroke="#171717" stroke-width="2"/><text x="72" y="362" font-size="19" fill="#171717">Marketing message</text><text x="72" y="402" font-size="18" fill="#171717">Clear, structured, bilingual</text><text x="1128" y="170" font-size="20" fill="white" text-anchor="end">٠٢ / محتوى عربي أولًا</text><text x="1128" y="248" font-size="51" fill="white" text-anchor="end">وصول</text><text x="1128" y="302" font-size="24" fill="white" text-anchor="end">وضوح في إدارة أعمالك</text><path d="M642 340H1128" stroke="white" stroke-width="2"/><text x="1128" y="390" font-size="18" fill="white" text-anchor="end">تطبيق تحريري تجريبي</text></g><g fill="#171717" font-family="sans-serif"><text x="44" y="644" font-size="22">Recognition test: FAIL / not tested empirically</text><text x="44" y="687" font-size="18">Layout alone cannot establish brand distinction.</text><text x="44" y="721" font-size="18">Arabic is live text; requires shaping/font verification.</text></g></svg>