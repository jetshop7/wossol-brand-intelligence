<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900">
<title>Wossol Round 2 compact mark exact size tests</title><desc>Three original editable vector concepts evaluated as raster specimens at exactly 24, 36, 48 and 72 pixels; all preliminary and unapproved.</desc>
<defs><style>.ink{fill:#142D31}.paper{fill:#F3F1EA}.white{fill:#fff}.muted{fill:#65726f}.lime{fill:#D9F064}.label{font:700 14px Arial,sans-serif;letter-spacing:1.3px}.small{font:13px Arial,sans-serif}.body{font:16px Arial,sans-serif}</style>
<g id="m1" fill="none" stroke="#142D31" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M8 26 C15 10 29 10 35 24 C41 38 54 38 62 24 C70 10 84 10 92 26"/><path d="M24 43 C33 32 45 32 53 43 C61 54 73 54 82 43"/></g>
<g id="m2" fill="none" stroke="#142D31" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17 C27 9 44 10 53 18 C63 28 59 43 48 51 C37 59 25 54 20 47 C35 57 56 60 74 53 L88 42 L88 58 C72 73 49 76 31 68 C16 61 8 45 15 17 Z"/><path d="M17 62 Q47 76 82 61"/></g>
<g id="m3" fill="none" stroke="#142D31" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18 L31 68 L49 39 L67 68 L86 18"/><path d="M28 72 C38 83 61 84 75 73"/></g>
</defs>
<rect width="1540" height="900" fill="#E7E9E4"/><rect x="35" y="30" width="1470" height="840" rx="22" class="paper"/><text x="75" y="82" class="ink label">WOSSOL · ROUND 2 · THREE COMPACT DIRECTIONS, FOUR EXACT RASTER SIZES</text><text x="75" y="110" class="muted small">Editable path concepts, independently authored; exported tiles use exact pixel dimensions at 1×. No generic frames, arrows, paired-O, or plain-waw marks.</text>
<text x="75" y="163" class="muted label">CONCEPT</text><text x="482" y="163" text-anchor="middle" class="muted label">24 PX</text><text x="732" y="163" text-anchor="middle" class="muted label">36 PX</text><text x="982" y="163" text-anchor="middle" class="muted label">48 PX</text><text x="1262" y="163" text-anchor="middle" class="muted label">72 PX</text>
<rect x="70" y="183" width="1400" height="176" rx="16" class="white"/><text x="90" y="221" class="ink label">01 · DOUBLE-S / SHARED CURRENT</text><text x="90" y="249" class="muted small">Name-derived continuous ribbon; tests a repeatable motion cue.</text><text x="90" y="286" class="muted small">24–36: collapses to generic wave. REJECT.</text><use href="#m1" transform="translate(470 211) scale(.24)"/><use href="#m1" transform="translate(700 207) scale(.36)"/><use href="#m1" transform="translate(942 201) scale(.48)"/><use href="#m1" transform="translate(1210 191) scale(.72)"/>
<rect x="70" y="378" width="1400" height="176" rx="16" class="white"/><text x="90" y="416" class="ink label">02 · SAD / OPEN-SHOULDER SEAL</text><text x="90" y="444" class="muted small">A bespoke ṣād bowl with a lifted shoulder and open terminal.</text><text x="90" y="481" class="muted small">Distinct in isolation, but Arabic letter recognition is unverified.</text><text x="90" y="506" class="lime label">ADVANCE TO NATIVE-READER TEST</text><use href="#m2" transform="translate(470 405) scale(.24)"/><use href="#m2" transform="translate(700 399) scale(.36)"/><use href="#m2" transform="translate(942 393) scale(.48)"/><use href="#m2" transform="translate(1210 381) scale(.72)"/>
<rect x="70" y="573" width="1400" height="176" rx="16" class="white"/><text x="90" y="611" class="ink label">03 · W / JOINED BASELINE</text><text x="90" y="639" class="muted small">Custom Latin W meets a single anchored baseline; not an arrow.</text><text x="90" y="676" class="muted small">24 px muddies the W; larger sizes feel like a monogram, not Wossol.</text><text x="90" y="701" class="muted label">HOLD · ONLY IF PRODUCT CONTEXT SUPPORTS LATIN</text><use href="#m3" transform="translate(470 600) scale(.24)"/><use href="#m3" transform="translate(700 594) scale(.36)"/><use href="#m3" transform="translate(942 588) scale(.48)"/><use href="#m3" transform="translate(1210 576) scale(.72)"/>
<rect x="70" y="776" width="1400" height="60" rx="14" fill="#142D31"/><text x="92" y="813" class="lime label">NO COMPACT MARK APPROVED · 02 IS A TEST CANDIDATE, NOT A FINAL ICON</text><text x="1445" y="813" text-anchor="end" class="white small">Review legibility at each printed tile; display view is enlarged for comparison.</text>
</svg>
