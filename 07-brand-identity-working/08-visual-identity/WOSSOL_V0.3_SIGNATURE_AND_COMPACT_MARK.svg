<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2150" viewBox="0 0 1800 2150">
<title>WOSSOL V0.3 — Docket Stitch signature and compact-mark study</title><desc>Editable exploratory signature rooted in selected order/product/stock evidence, plus one compact candidate tested in both themes at 24, 36, 48 and 72 pixels. No recognition test or approval.</desc>
<defs><style>.paper{fill:#F7F6F0}.soft{fill:#F0F3EE}.ink{fill:#142925}.muted{fill:#596D68}.harbor{fill:#153B3A}.night{fill:#0E2528}.deep{fill:#09191C}.lime{fill:#D7F06A}.line{stroke:#CFD8D2;stroke-width:2}.lineD{stroke:#294448;stroke-width:2}.mutedD{fill:#AEC0BB}.white{fill:#F7F6F0}.k{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.4px}.h1{font:700 42px Inter,Arial,sans-serif}.h2{font:650 22px Inter,Arial,sans-serif}.b{font:400 16px Inter,Arial,sans-serif}.s{font:400 13px Inter,Arial,sans-serif}.xs{font:650 11px Inter,Arial,sans-serif;letter-spacing:.6px}</style>
<g id="docket-stitch" fill="none" stroke="#153B3A" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14 H44 M58 14 H91 M8 40 H33 M47 40 H91 M8 66 H44 M58 66 H91" stroke-width="8"/><path d="M48 7 V73" stroke-width="4"/><rect x="40" y="32" width="16" height="16" rx="3" fill="#D7F06A" stroke="#153B3A" stroke-width="3"/></g>
<g id="docket-stitch-dark" fill="none" stroke="#F7F6F0" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14 H44 M58 14 H91 M8 40 H33 M47 40 H91 M8 66 H44 M58 66 H91" stroke-width="8"/><path d="M48 7 V73" stroke-width="4"/><rect x="40" y="32" width="16" height="16" rx="3" fill="#D7F06A" stroke="#F7F6F0" stroke-width="3"/></g></defs>
<rect width="1800" height="2150" class="paper"/><text x="72" y="64" class="k muted">WOSSOL · V0.3 · GRAPHIC SIGNATURE STUDY</text><text x="72" y="130" class="h1 ink">The Docket Stitch</text><text x="72" y="170" class="b muted">A selected-record grammar—not a universal network, lifecycle, or outcome promise.</text>
<rect x="72" y="215" width="1656" height="390" rx="24" class="night"/><text x="112" y="266" class="k lime">CONCEPT HYPOTHESIS · CONTEXT HELD TOGETHER</text><text x="112" y="321" class="h2 white">Order → product → stock → fulfilment evidence</text><text x="112" y="357" class="s mutedD">The seam marks a shared identifier or moment. A break means the relationship is absent, conditional or unverified.</text>
<g transform="translate(132 409) scale(1.45)"><use href="#docket-stitch"/></g><g class="white"><text x="330" y="443" class="b">Order  ·  W-1042</text><text x="330" y="481" class="b">Product  ·  item reference</text><text x="330" y="519" class="b">Stock  ·  available / expected</text><text x="330" y="557" class="b">Outcome  ·  only where verified</text></g><line x1="780" y1="432" x2="1560" y2="432" stroke="#75908A" stroke-width="3"/><circle cx="864" cy="432" r="9" fill="#D7F06A"/><circle cx="1100" cy="432" r="9" fill="#D7F06A" stroke="#F7F6F0" stroke-width="2"/><circle cx="1348" cy="432" r="9" fill="#0E2528" stroke="#AEC0BB" stroke-width="3"/><path d="M1348 432 H1455" stroke="#AEC0BB" stroke-width="3" stroke-dasharray="7 10"/><circle cx="1500" cy="432" r="9" fill="#0E2528" stroke="#FF9B83" stroke-width="3"/><text x="864" y="470" text-anchor="middle" class="xs mutedD">ORDER</text><text x="1100" y="470" text-anchor="middle" class="xs mutedD">ITEM</text><text x="1348" y="470" text-anchor="middle" class="xs mutedD">STOCK</text><text x="1500" y="470" text-anchor="middle" class="xs mutedD">UNKNOWN</text><text x="780" y="532" class="s mutedD">This visual borrows from records and selected joins found in merchant work—not network topology.</text>
<text x="72" y="676" class="k harbor">APPLICATION TEST · SAME MOTIF, DIFFERENT JOBS</text>
<rect x="72" y="704" width="800" height="415" rx="20" fill="#fff" stroke="#CFD8D2" stroke-width="2"/><text x="108" y="753" class="k muted">WEBSITE HERO / PROSPECTIVE</text><text x="108" y="810" class="h2 ink">Commerce work, in its context.</text><text x="108" y="846" class="s muted">Orders, product and stock records shown as separate evidence.</text><rect x="108" y="886" width="728" height="172" rx="13" fill="#F0F3EE"/><g transform="translate(146 929) scale(.9)"><use href="#docket-stitch"/></g><text x="268" y="941" class="b ink">Order W-1042</text><text x="268" y="978" class="s muted">Product key · same order context</text><text x="268" y="1015" class="s" fill="#A93F32">Stock link incomplete · verify</text>
<rect x="900" y="704" width="828" height="415" rx="20" fill="#0E2528"/><text x="936" y="753" class="k lime">DASHBOARD / DARK</text><text x="936" y="810" class="h2 white">Keep the evidence with the work.</text><rect x="936" y="846" width="756" height="209" rx="13" fill="#152F33" stroke="#294448" stroke-width="2"/><g transform="translate(976 904) scale(.9)"><use href="#docket-stitch-dark"/></g><text x="1100" y="917" class="b white">Order W-1042 · sample</text><text x="1100" y="954" class="s mutedD">Product joined · stock state available</text><text x="1100" y="991" class="s mutedD">Delivery outcome not shown in this record</text><text x="1100" y="1028" class="xs" fill="#FF9B83">NO UNVERIFIED COMPLETION CUE</text>
<text x="72" y="1190" class="k harbor">COMPACT MARK TEST · DERIVED FROM THE SAME “STITCHED RECORD” GEOMETRY</text><text x="72" y="1224" class="s muted">Desk result: reject as a standalone brand mark. The 24/36px form reads as a generic list/menu; recognition remains untested.</text>
<text x="72" y="1275" class="k muted">LIGHT GROUND</text><text x="900" y="1275" class="k muted">DARK GROUND</text>
<!-- exact-size artboards use vectorGroup scale tied to 96-unit nominal box -->
<g><rect x="72" y="1300" width="790" height="500" rx="18" fill="#fff" stroke="#CFD8D2" stroke-width="2"/><rect x="900" y="1300" width="828" height="500" rx="18" class="night"/>
<g transform="translate(122 1360)"><rect width="24" height="24" rx="5" class="soft"/><g transform="translate(2.25 3) scale(.2)"><use href="#docket-stitch"/></g><text x="12" y="65" text-anchor="middle" class="xs muted">24 px</text></g>
<g transform="translate(278 1354)"><rect width="36" height="36" rx="7" class="soft"/><g transform="translate(4.5 5) scale(.28)"><use href="#docket-stitch"/></g><text x="18" y="76" text-anchor="middle" class="xs muted">36 px</text></g>
<g transform="translate(460 1348)"><rect width="48" height="48" rx="9" class="soft"/><g transform="translate(7 8) scale(.36)"><use href="#docket-stitch"/></g><text x="24" y="88" text-anchor="middle" class="xs muted">48 px</text></g>
<g transform="translate(654 1338)"><rect width="72" height="72" rx="13" class="soft"/><g transform="translate(14 15) scale(.46)"><use href="#docket-stitch"/></g><text x="36" y="112" text-anchor="middle" class="xs muted">72 px</text></g>
<g transform="translate(950 1360)"><rect width="24" height="24" rx="5" fill="#152F33" stroke="#294448"/><g transform="translate(2.25 3) scale(.2)"><use href="#docket-stitch-dark"/></g><text x="12" y="65" text-anchor="middle" class="xs mutedD">24 px</text></g>
<g transform="translate(1106 1354)"><rect width="36" height="36" rx="7" fill="#152F33" stroke="#294448"/><g transform="translate(4.5 5) scale(.28)"><use href="#docket-stitch-dark"/></g><text x="18" y="76" text-anchor="middle" class="xs mutedD">36 px</text></g>
<g transform="translate(1288 1348)"><rect width="48" height="48" rx="9" fill="#152F33" stroke="#294448"/><g transform="translate(7 8) scale(.36)"><use href="#docket-stitch-dark"/></g><text x="24" y="88" text-anchor="middle" class="xs mutedD">48 px</text></g>
<g transform="translate(1482 1338)"><rect width="72" height="72" rx="13" fill="#152F33" stroke="#294448"/><g transform="translate(14 15) scale(.46)"><use href="#docket-stitch-dark"/></g><text x="36" y="112" text-anchor="middle" class="xs mutedD">72 px</text></g>
<text x="108" y="1564" class="h2 ink">Light: Harbor strokes · lime checkpoint</text><text x="108" y="1602" class="s muted">24px: seam/negative gaps at risk. 36px: readable as record device.</text><text x="108" y="1635" class="s muted">48–72px: join logic clearer; central square may dominate.</text><text x="936" y="1564" class="h2 white">Dark: paper strokes · lime checkpoint</text><text x="936" y="1602" class="s mutedD">24px: seam/negative gaps at risk. 36px: readable as record device.</text><text x="936" y="1635" class="s mutedD">48–72px: join logic clearer; central square may dominate.</text></g>
<rect x="72" y="1840" width="1656" height="234" rx="18" fill="#E7EEEB"/><text x="108" y="1886" class="k harbor">DESK DECISION · RETAIN GRAPHIC GRAMMAR; REJECT COMPACT MARK</text><text x="108" y="1930" class="b ink">Docket Stitch may work as a supporting device for Wossol's selected, evidence-bounded merchant records.</text><text x="108" y="1965" class="s ink">At 24/36px it reads as a generic list/menu, not a distinctive brand signature; 48/72px clarify the seam but do not solve ownability.</text><text x="108" y="2000" class="s ink">Reject this standalone mark candidate. Keep the compact-mark decision open; do not replace the platform's temporary W.</text><text x="108" y="2035" class="s ink">Graphic grammar itself remains UNDER_REVIEW; no user validation, trademark assessment or pixel-hinting test is claimed.</text>
</svg>
