<rect width="1800" height="2200" class="paper"/>
<text x="72" y="68" class="k muted">WOSSOL · VISUAL IDENTITY V0.3 · UNDER REVIEW</text><text x="72" y="136" class="h1 ink">One system. Two working environments.</text><text x="72" y="181" class="b muted">Light and Dark are designed as first-class themes—not a color inversion. All values below are proposals.</text>
<text x="1370" y="91" class="xs muted">APPEARANCE · USER PREFERENCE</text><rect x="1370" y="105" width="360" height="44" rx="10" fill="#FFFFFF" stroke="#CFD8D2" stroke-width="2"/><rect x="1376" y="111" width="168" height="32" rx="7" fill="#153B3A"/><text x="1460" y="132" text-anchor="middle" class="s" fill="#F7F6F0">Light</text><text x="1630" y="132" text-anchor="middle" class="s ink">Dark</text>
<rect x="72" y="220" width="1656" height="182" rx="24" class="night"/><use href="#clear-stroke-inverse" transform="translate(116 250) scale(.72)"/><text x="116" y="378" class="xs limeText">A / CLEAR STROKE · PROVISIONAL · NOT APPROVED</text><text x="610" y="282" class="h2 whiteText">Evidence Thread → Docket Stitch</text><text x="610" y="326" class="b quietD">Connect only the merchant context the product actually preserves.</text><text x="610" y="360" class="s quietD">A visual grammar for order / product / stock records, with visible breaks where evidence is absent.</text>
<text x="72" y="470" class="k harbor">01 · LIGHT THEME</text><text x="900" y="470" class="k harbor">02 · DARK THEME</text>
