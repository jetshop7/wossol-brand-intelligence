<rect x="278" y="916" width="558" height="208" rx="14" class="panel"/><text x="302" y="954" class="h3 ink">Current work</text><text x="302" y="984" class="s muted">Keep connected information visible, not overstated.</text><line x1="314" y1="1032" x2="786" y2="1032" stroke="#A9B7B0" stroke-width="3"/><circle cx="352" cy="1032" r="10" fill="#153B3A"/><circle cx="525" cy="1032" r="10" fill="#D7F06A" stroke="#153B3A" stroke-width="2"/><circle cx="710" cy="1032" r="10" fill="#F7F6F0" stroke="#596D68" stroke-width="3"/><text x="324" y="1072" class="xs muted">ORDER</text><text x="491" y="1072" class="xs muted">STOCK</text><text x="666" y="1072" class="xs muted">OUTCOME?</text><text x="302" y="1101" class="xs coral">BROKEN LINE = NOT VERIFIED / NOT CONNECTED</text>
