<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
<title>WOSSOL V0.3 — dual-theme visual system</title>
<desc>Editable proposal showing first-class Light and Dark themes, semantic roles, state treatments, accessibility notes and provisional Clear Stroke wordmark. No visual decision approved.</desc>
<defs>
 <style>
 .paper{fill:#F7F6F0}.white{fill:#fff}.night{fill:#0E2528}.deep{fill:#09191C}.harbor{fill:#153B3A}.mist{fill:#E7EEEB}.line{stroke:#CFD8D2;stroke-width:2}.lineD{stroke:#294448;stroke-width:2}.ink{fill:#142925}.body{fill:#263B37}.muted{fill:#596D68}.soft{fill:#F0F3EE}.lime{fill:#D7F06A}.coral{fill:#A93F32}.blue{fill:#356D8A}.whiteText{fill:#F7F6F0}.darkText{fill:#102522}.limeText{fill:#D7F06A}.quietD{fill:#AEC0BB}.panel{fill:#fff;stroke:#CFD8D2;stroke-width:2}.panelD{fill:#152F33;stroke:#294448;stroke-width:2}
