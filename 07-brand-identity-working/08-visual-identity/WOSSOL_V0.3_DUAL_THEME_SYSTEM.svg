<text x="72" y="1325" class="k harbor">03 · SEMANTIC ROLE MAP</text><text x="900" y="1325" class="k harbor">04 · STATES &amp; ACCESSIBILITY</text>
<rect x="72" y="1350" width="800" height="590" rx="18" class="panel"/><rect x="900" y="1350" width="828" height="590" rx="18" class="night"/>
<text x="108" y="1398" class="h3 ink">Color is assigned by job, not decoration.</text><text x="108" y="1432" class="s muted">The same role has a different tuned value per mode.</text>
<g class="s ink"><text x="108" y="1490">App canvas</text><text x="108" y="1540">Raised surface</text><text x="108" y="1590">Sidebar</text><text x="108" y="1640">Primary text</text><text x="108" y="1690">Secondary text</text><text x="108" y="1740">Border</text><text x="108" y="1790">Primary action</text><text x="108" y="1840">Focus / checkpoint</text><text x="108" y="1890">Status (with label)</text></g>
<g class="mono ink"><text x="360" y="1490">#F7F6F0</text><text x="360" y="1540">#FFFFFF</text><text x="360" y="1590">#153B3A</text><text x="360" y="1640">#142925</text><text x="360" y="1690">#596D68</text><text x="360" y="1740">#CFD8D2</text><text x="360" y="1790">#153B3A</text><text x="360" y="1840">#D7F06A</text><text x="360" y="1890">#A93F32 / #356D8A</text></g>
<g class="mono ink"><text x="600" y="1490">#09191C</text><text x="600" y="1540">#152F33</text><text x="600" y="1590">#0B2023</text><text x="600" y="1640">#F7F6F0</text><text x="600" y="1690">#AEC0BB</text><text x="600" y="1740">#294448</text><text x="600" y="1790">#D7F06A</text><text x="600" y="1840">#D7F06A</text><text x="600" y="1890">#FF9B83 / #88B8D2</text></g>
<text x="360" y="1930" class="xs muted">LIGHT</text><text x="600" y="1930" class="xs muted">DARK</text>
<text x="936" y="1398" class="h3 whiteText">Controls stay legible and predictable.</text>
<rect x="936" y="1430" width="210" height="52" rx="11" fill="#D7F06A"/><text x="1041" y="1463" text-anchor="middle" class="s darkText">Primary action</text><rect x="1160" y="1430" width="210" height="52" rx="11" fill="#152F33" stroke="#AEC0BB" stroke-width="2"/><text x="1265" y="1463" text-anchor="middle" class="s whiteText">Secondary</text><rect x="1384" y="1430" width="280" height="52" rx="11" fill="#10282B" stroke="#D7F06A" stroke-width="3"/><text x="1524" y="1463" text-anchor="middle" class="s limeText">Focus ring · 3px</text>
<rect x="936" y="1510" width="348" height="82" rx="11" fill="#152F33" stroke="#59716E" stroke-width="2"/><text x="958" y="1542" class="xs quietD">SEARCH ORDERS</text><text x="958" y="1572" class="s whiteText">Order ID or customer…</text><rect x="1300" y="1510" width="364" height="82" rx="11" fill="#152F33" stroke="#294448" stroke-width="2" opacity=".72"/><text x="1322" y="1542" class="xs quietD">DISABLED CONTROL</text><text x="1322" y="1572" class="s quietD">Not available in this state</text>
<rect x="936" y="1620" width="728" height="192" rx="13" fill="#152F33" stroke="#294448" stroke-width="2"/><rect x="936" y="1620" width="728" height="42" rx="13" fill="#0B2023"/><text x="958" y="1648" class="xs quietD">TABLE · LABELS + STATUS, NOT COLOR ALONE</text><line x1="936" y1="1708" x2="1664" y2="1708" class="lineD"/><text x="958" y="1692" class="s whiteText">Order 1042</text><rect x="1424" y="1674" width="126" height="28" rx="14" fill="#24483B"/><circle cx="1440" cy="1688" r="4" fill="#9BE0B0"/><text x="1453" y="1693" class="xs" fill="#B9F1C8">Confirmed</text><line x1="936" y1="1756" x2="1664" y2="1756" class="lineD"/><text x="958" y="1740" class="s whiteText">Order 1043</text><rect x="1424" y="1722" width="126" height="28" rx="14" fill="#4B3224"/><path d="M1440 1729 l7 14 h-14 z" fill="#FFD082"/><text x="1453" y="1741" class="xs" fill="#FFDCA4">Review</text>
<text x="936" y="1858" class="s quietD">Hover: raise border · Active: fill shift · Selected: fill + 3px rail</text><text x="936" y="1890" class="s quietD">Success / warning / error / info: icon + text + shape; never hue alone.</text><text x="936" y="1922" class="s quietD">Charts: label series directly; solid = measured, dashed = projection.</text>
<rect x="72" y="1980" width="1656" height="150" rx="18" fill="#E7EEEB"/><text x="108" y="2025" class="k harbor">QUALITY GATE · NOT YET A PRODUCTION SYSTEM</text><text x="108" y="2060" class="s ink">Contrast checked as opaque sRGB role pairs; interaction, native focus, browser rendering, all chart series, color-vision simulation and user-chosen preferences still require implementation QA.</text><text x="108" y="2095" class="s ink">Synthetic quantities are placeholders. A/Clear Stroke, both themes, typography and palette remain provisional; no owner approval is implied.</text>
