<text x="595" y="608" class="muted small">REJECT FOR NOW · joins collide and sad/waw contours lack clear letter anatomy.</text>
<rect x="1050" y="414" width="470" height="220" rx="18" class="white"/><text x="1080" y="448" class="muted small">B · FACETED ANGULAR TRIAL</text><text x="1080" y="522" class="ink body">REJECT</text><text x="1080" y="558" class="muted small">Compressed joins and irregular terminals obscure ṣād recognition.</text><text x="1080" y="590" class="muted small">Neither candidate meets the shaping reference or professional finish.</text>
<text x="80" y="680" class="muted label">BILINGUAL LOCKUPS · SAME LETTERING PAIR, TWO HIERARCHIES</text>
