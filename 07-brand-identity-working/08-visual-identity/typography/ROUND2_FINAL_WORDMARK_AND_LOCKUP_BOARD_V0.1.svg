<rect x="820" y="702" width="700" height="190" rx="18" class="white"/><text x="850" y="736" class="muted small">ARABIC-FIRST · STACKED</text><g transform="translate(1000 753) scale(.42)" fill="none" stroke="#142D31" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M95 132 L95 39 Q95 30 105 30 L112 30 L112 101 Q112 129 92 140 Q76 148 61 137"/><path d="M188 105 C180 89 197 72 215 78 C232 84 232 103 218 115 C205 126 189 121 182 110 C201 121 221 124 239 117"/><path d="M239 117 C259 127 281 124 296 113 C307 105 311 86 318 66 C324 49 338 44 350 55 C362 67 352 82 347 97 C363 113 386 112 402 99 L420 84 L420 107 C400 127 376 130 353 119 C337 139 313 142 292 132 C273 126 255 118 239 117"/><path d="M485 100 C471 84 452 86 444 102 C435 119 453 134 470 127 C484 121 488 108 482 97 C488 124 474 146 453 155 C440 161 428 157 419 151"/></g><g transform="translate(1080 827) scale(.42)" fill="none" stroke="#142D31" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M0 18 L22 81 L47 43 L72 81 L96 18"/><path d="M117 56 C117 31 166 31 166 56 V76 C166 101 117 101 117 76 Z"/><path d="M213 46 C197 34 174 41 174 54 C174 67 213 69 213 84 C213 101 190 106 171 94"/><path d="M267 46 C251 34 228 41 228 54 C228 67 267 69 267 84 C267 101 244 106 225 94"/><path d="M291 56 C291 31 340 31 340 56 V76 C340 101 291 101 291 76 Z"/><path d="M374 17 V97 Q374 105 386 105 H405"/></g><text x="850" y="866" class="muted small">Arabic leads, but this lockup is not ready while the custom Arabic is rejected.</text>
<rect x="80" y="930" width="1440" height="190" rx="18" fill="#142D31"/><text x="112" y="972" class="lime label">ROUND-1 A-FIRST RECOMMENDATION · RETAIN ONLY AS A HIERARCHY HYPOTHESIS</text><text x="112" y="1012" class="white body">R3 is a better Latin construction than R2-C. The evidence does not yet justify choosing A over B as the identity.</text><text x="112" y="1045" class="soft body">A-first reads more naturally for a Latin-led commerce interface; Arabic-first remains necessary to test with native readers.</text><text x="112" y="1084" class="soft body">The custom Arabic paths both fail: a genuine specialist lettering pass is still the largest open craft gap.</text><text x="112" y="1110" class="soft small">No final identity, lockup, compact mark, colors, or positioning approved. Needs native-reader and owner review.</text>
