<g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#153B3A"><rect x="170" y="755" width="90" height="90" rx="10" fill="#fff" stroke="#CFD8D2"/><use href="#seam" transform="translate(207 792) scale(.16)" stroke="#153B3A" stroke-width="75"/><rect x="315" y="755" width="90" height="90" rx="10" fill="#fff" stroke="#CFD8D2"/><use href="#seam" transform="translate(348 788) scale(.24)" stroke="#153B3A" stroke-width="50"/><rect x="460" y="755" width="90" height="90" rx="10" fill="#fff" stroke="#CFD8D2"/><use href="#seam" transform="translate(487 782) scale(.36)" stroke="#153B3A" stroke-width="33.33"/><rect x="605" y="755" width="90" height="90" rx="10" fill="#fff" stroke="#CFD8D2"/><use href="#seam" transform="translate(628 778) scale(.48)" stroke="#153B3A" stroke-width="25"/><rect x="750" y="755" width="90" height="90" rx="10" fill="#fff" stroke="#CFD8D2"/><use href="#seam" transform="translate(759 764) scale(.72)" stroke="#153B3A" stroke-width="16.67"/></g><g stroke="#F7F6F0"><rect x="1035" y="755" width="90" height="90" rx="10" fill="#0E2528" stroke="#284342"/><use href="#seamW" transform="translate(1077 792) scale(.16)" stroke="#F7F6F0" stroke-width="75"/><rect x="1180" y="755" width="90" height="90" rx="10" fill="#0E2528" stroke="#284342"/><use href="#seamW" transform="translate(1218 788) scale(.24)" stroke="#F7F6F0" stroke-width="50"/><rect x="1325" y="755" width="90" height="90" rx="10" fill="#0E2528" stroke="#284342"/><use href="#seamW" transform="translate(1357 782) scale(.36)" stroke="#F7F6F0" stroke-width="33.33"/><rect x="1470" y="755" width="90" height="90" rx="10" fill="#0E2528" stroke="#284342"/><use href="#seamW" transform="translate(1498 778) scale(.48)" stroke="#F7F6F0" stroke-width="25"/><rect x="1615" y="755" width="90" height="90" rx="10" fill="#0E2528" stroke="#284342"/><use href="#seamW" transform="translate(1624 764) scale(.72)" stroke="#F7F6F0" stroke-width="16.67"/></g></g>
<rect x="64" y="910" width="1672" height="420" rx="18" class="card"/><text x="100" y="960" class="k muted">PAIRING / SYSTEM CONSEQUENCE</text><g transform="translate(110 1010) scale(1.15)" class="mark"><path d="M8 23 L30 101 Q33 111 42 111 L62 66 L82 111 Q91 111 94 101 L116 23"/><path d="M141 43 C141 19 190 19 190 43 V86 C190 110 141 110 141 86 Z"/><path d="M274 30 C254 17 221 21 221 42 C221 59 267 59 267 78 C267 101 237 111 213 94"/><path d="M345 30 C325 17 292 21 292 42 C292 59 338 59 338 78 C338 101 308 111 284 94"/><path d="M369 43 C369 19 418 19 418 43 V86 C418 110 369 110 369 86 Z"/><path d="M451 22 V101 Q451 111 462 111 H501"/></g><text x="760" y="1055" class="h2 ink">No standalone mark selected</text><text x="760" y="1095" class="body muted">A1 Clear Stroke can lead in wide placements, but no candidate is ready for the 36 px sidebar,</text><text x="760" y="1125" class="body muted">favicon or avatar. Keep the current W as a temporary product placeholder only; do not ship these studies.</text><text x="100" y="1240" class="small muted">Test method: vector outlines occupy the stated nominal square in CSS-pixel proportion, displayed inside identical 90×90 comparison cells.</text><text x="100" y="1270" class="small muted">Desk visualization only—not browser/device rasterization, recognition testing, accessibility review or owner approval.</text><text x="64" y="1380" class="xs muted">C1 FAILS DISTINCTIVENESS · C2 FAILS SMALL-SIZE READABILITY · NO ICON WINNER</text></svg>
