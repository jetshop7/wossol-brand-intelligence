<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420">
<title>WOSSOL V0.4 compact mark tests</title><desc>Two editable wordmark-derived symbols: a notched O aperture and an S seam. Both shown as actual 16, 24, 36, 48 and 72 pixel glyph canvases on light and dark backgrounds. Neither is approved; small-size and genericity risks are called out.</desc>
<defs><style>.bg{fill:#F7F6F0}.card{fill:#fff;stroke:#CFD8D2;stroke-width:2}.night{fill:#0E2528}.ink{fill:#153B3A}.paper{fill:#F7F6F0}.lime{fill:#D7F06A}.muted{fill:#596D68}.line{stroke:#CFD8D2;stroke-width:2}.k{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.5px}.h1{font:700 38px Inter,Arial,sans-serif}.h2{font:650 23px Inter,Arial,sans-serif}.body{font:400 16px Inter,Arial,sans-serif}.small{font:400 13px Inter,Arial,sans-serif}.xs{font:700 11px Inter,Arial,sans-serif;letter-spacing:.5px}.mark{fill:none;stroke:#153B3A;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.markW{fill:none;stroke:#F7F6F0;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}</style>
<g id="aperture" class="mark"><path d="M50 7 C78 7 93 22 93 50 C93 78 78 93 50 93 C22 93 7 78 7 50 C7 22 22 7 50 7 Z"/><path d="M50 7 L50 31 M50 69 L50 93"/></g>
<g id="seam" class="mark"><path d="M77 18 C63 7 25 10 20 30 C14 52 74 48 78 69 C82 91 43 98 20 82"/><path d="M14 50 H34"/></g>
<g id="apertureW" class="markW"><path d="M50 7 C78 7 93 22 93 50 C93 78 78 93 50 93 C22 93 7 78 7 50 C7 22 22 7 50 7 Z"/><path d="M50 7 L50 31 M50 69 L50 93"/></g><g id="seamW" class="markW"><path d="M77 18 C63 7 25 10 20 30 C14 52 74 48 78 69 C82 91 43 98 20 82"/><path d="M14 50 H34"/></g>
</defs>
<rect width="1800" height="1420" class="bg"/><text x="64" y="60" class="k muted">WOSSOL · V0.4 · COMPACT MARK CANDIDATES</text><text x="64" y="120" class="h1 ink">Two wordmark-derived studies. Neither clears the bar.</text><text x="64" y="160" class="body muted">Each candidate borrows a specific Clear Stroke glyph; the relationship is real, but the standalone meaning remains weak.</text>
<rect x="64" y="205" width="810" height="260" rx="18" class="card"/><text x="100" y="250" class="k muted">C1 · COUNTER APERTURE · DERIVED FROM O</text><g transform="translate(120 285) scale(1.25)"><use href="#aperture"/></g><text x="270" y="305" class="h2 ink">A seam through O’s counter</text><text x="270" y="340" class="body muted">Intent: an open record / visible passage.</text><text x="270" y="372" class="small muted">Risk: reads as a generic interrupted ring or target.</text><text x="270" y="408" class="xs" fill="#A93F32">REJECT · NOT OWNABLE ENOUGH</text>
<rect x="900" y="205" width="836" height="260" rx="18" class="card"/><text x="936" y="250" class="k muted">C2 · S SEAM · DERIVED FROM CLEAR STROKE S</text><g transform="translate(958 285) scale(1.25)"><use href="#seam"/></g><text x="1108" y="305" class="h2 ink">A small seam in the S gesture</text><text x="1108" y="340" class="body muted">Intent: a specific trace, not a generic arrow.</text><text x="1108" y="372" class="small muted">Risk: resembles a currency glyph / unfinished S.</text><text x="1108" y="408" class="xs" fill="#A93F32">REJECT · READABILITY / DISTINCTIVENESS</text>
<text x="64" y="520" class="h2 ink">Exact-size desk tests · Light field</text><text x="930" y="520" class="h2 ink">Exact-size desk tests · Dark field</text>
<g class="small muted"><text x="215" y="565">16 px</text><text x="360" y="565">24 px</text><text x="505" y="565">36 px</text><text x="650" y="565">48 px</text><text x="795" y="565">72 px</text><text x="1080" y="565">16 px</text><text x="1225" y="565">24 px</text><text x="1370" y="565">36 px</text><text x="1515" y="565">48 px</text><text x="1660" y="565">72 px</text></g>
<text x="74" y="695" class="k ink">C1</text><text x="74" y="860" class="k ink">C2</text><text x="940" y="695" class="k ink">C1</text><text x="940" y="860" class="k ink">C2</text>
