<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1840" viewBox="0 0 1800 1840">
<title>WOSSOL primary Latin wordmark and compact mark review V0.1</title>
<desc>Three original editable Latin wordmark constructions and three derived compact mark concepts, rendered monochrome with actual-size compact tests. Exploratory, no identity approval.</desc>
<defs>
<style>.bg{fill:#E7E9E4}.paper{fill:#F5F2EA}.card{fill:#fff}.ink{fill:#142D31}.muted{fill:#65736f}.subtle{fill:#d8ded8}.title{font:700 15px Arial,sans-serif;letter-spacing:1.4px}.small{font:13px Arial,sans-serif}.body{font:16px Arial,sans-serif}.tag{font:700 12px Arial,sans-serif;letter-spacing:1.2px}</style>

