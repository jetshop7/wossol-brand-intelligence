</defs>

<rect width="1800" height="1840" class="bg"/><rect x="36" y="28" width="1728" height="1784" rx="24" class="paper"/>
<text x="78" y="82" class="ink title">WOSSOL · PRIMARY LATIN LOGO + COMPACT MARK · EXPLORATORY V0.1</text><text x="1720" y="82" text-anchor="end" class="muted small">MONOCHROME VECTOR STUDY · NOT APPROVED</text>
<text x="78" y="126" class="muted body">Three independent letter constructions; three compact directions. Same monochrome, no decorative mockups. Symbols have no container.</text>

<text x="78" y="184" class="ink title">01 · LATIN WORDMARK CONSTRUCTIONS</text>
<rect x="70" y="204" width="1660" height="178" rx="16" class="card"/><text x="98" y="237" class="ink tag">A · CLEAR STROKE / UPPERCASE R3 RECONSTRUCTION</text>
<use href="#wm-a" transform="translate(125 250) scale(1.15)"/><text x="930" y="276" class="muted body">Round, open, easy to scan;</text><text x="930" y="302" class="muted body">S pair carries one cut-back echo.</text><text x="930" y="345" class="ink tag">RISK · friendly but still generic at a glance</text>

<rect x="70" y="398" width="1660" height="178" rx="16" class="card"/><text x="98" y="431" class="ink tag">B · COUNTERFORM / SOFT PLANAR BLOCKS</text>
<text x="930" y="470" class="muted body">Solid silhouettes, broadened O counters,</text><text x="930" y="496" class="muted body">custom S bowl and visible word rhythm.</text><text x="930" y="539" class="ink tag">RISK · weighty; S strokes feel inserted, not familial</text>
<rect x="110" y="440" width="690" height="130" class="card"/><use href="#wm-b-final" transform="translate(125 440) scale(1.02)"/>

<rect x="70" y="592" width="1660" height="178" rx="16" class="card"/><text x="98" y="625" class="ink tag">C · SQUARE-TERMINAL / ANGULAR DISPLAY</text>
<text x="930" y="664" class="muted body">Firm stems, angular W, open S rhythm;</text><text x="930" y="690" class="muted body">a hard-edged counterpoint to round A.</text><text x="930" y="733" class="ink tag">REJECT · generic geometric feel; little ownable signature</text>
<rect x="110" y="634" width="690" height="125" class="card"/><use href="#wm-c-final" transform="translate(125 634) scale(1.02)"/>

<text x="78" y="824" class="ink title">02 · COMPACT MARKS · DERIVED FROM THE WORDMARK, NO FRAME OR BACKPLATE</text>
<rect x="70" y="842" width="530" height="174" rx="16" class="card"/><text x="96" y="875" class="ink tag">01 · SS SHARED-SPINE LIGATURE</text><use href="#mark-a" transform="translate(108 885) scale(1.06)"/><text x="230" y="915" class="muted small">A signature from A's two S forms.</text><text x="230" y="941" class="muted small">At 24px it risks a generic wave/infinity.</text><text x="230" y="974" class="ink tag">TEST · RECOGNITION UNCERTAIN</text>
<rect x="635" y="842" width="530" height="174" rx="16" class="card"/><text x="661" y="875" class="ink tag">02 · SCULPTED W / OPEN INNER NOTCH</text><use href="#mark-b-final" transform="translate(675 885) scale(1.06)"/><text x="795" y="915" class="muted small">B-family signature; no enclosure.</text><text x="795" y="941" class="muted small">Distinct counter helps, but W is crowded.</text><text x="795" y="974" class="ink tag">TEST · INITIAL MAY FEEL GENERIC</text>
<rect x="1200" y="842" width="530" height="174" rx="16" class="card"/><text x="1226" y="875" class="ink tag">03 · W→O CONTINUOUS LIGATURE</text><use href="#mark-c" transform="translate(1240 885) scale(1.06)"/><text x="1360" y="915" class="muted small">One stroke flows from angular W into O.</text><text x="1360" y="941" class="muted small">Fresh derivation; may still feel generic.</text><text x="1360" y="974" class="ink tag">HOLD · TEST DISTINCTIVENESS</text>

<text x="78" y="1044" class="ink title">03 · WORDMARK + MARK PAIRING / HEADER-SCALE CHECK</text>
<rect x="70" y="1060" width="530" height="150" rx="16" class="card"/><text x="96" y="1088" class="ink tag">A PAIR · LINKED SS · REJECT</text><use href="#wm-a" transform="translate(190 1100) scale(.48)"/><use href="#mark-a" transform="translate(110 1105) scale(.62)"/>
<rect x="635" y="1060" width="530" height="150" rx="16" class="card"/><text x="661" y="1088" class="ink tag">B PAIR · SCULPTED W · HOLD</text><use href="#wm-b-final" transform="translate(755 1100) scale(.48)"/><use href="#mark-b-final" transform="translate(675 1105) scale(.62)"/>
<rect x="1200" y="1060" width="530" height="150" rx="16" class="card"/><text x="1226" y="1088" class="ink tag">C PAIR · W/O LIGATURE · HOLD</text><use href="#wm-c-final" transform="translate(1320 1100) scale(.48)"/><use href="#mark-c" transform="translate(1240 1105) scale(.62)"/>
<text x="78" y="1252" class="ink title">04 · ACTUAL-SIZE STRESS TEST · ICON ARTBOARDS 24×24 / 36×36 / 48×48 / 72×72 PX</text>
<text x="760" y="1290" text-anchor="middle" class="muted tag">24 px</text><text x="960" y="1290" text-anchor="middle" class="muted tag">36 px</text><text x="1160" y="1290" text-anchor="middle" class="muted tag">48 px</text><text x="1420" y="1290" text-anchor="middle" class="muted tag">72 px</text>
<rect x="70" y="1306" width="1660" height="124" rx="14" class="card"/><text x="96" y="1335" class="ink tag">01 · SS</text><text x="96" y="1362" class="muted small">A · REJECT</text><use href="#mark-a" transform="translate(748 1327) scale(.24)"/><use href="#mark-a" transform="translate(942 1321) scale(.36)"/><use href="#mark-a" transform="translate(1136 1315) scale(.48)"/><use href="#mark-a" transform="translate(1384 1303) scale(.72)"/>
<rect x="70" y="1444" width="1660" height="124" rx="14" class="card"/><text x="96" y="1473" class="ink tag">02 · W</text><text x="96" y="1500" class="muted small">B · HOLD</text><use href="#mark-b-final" transform="translate(748 1465) scale(.24)"/><use href="#mark-b-final" transform="translate(942 1459) scale(.36)"/><use href="#mark-b-final" transform="translate(1136 1453) scale(.48)"/><use href="#mark-b-final" transform="translate(1384 1441) scale(.72)"/>
<rect x="70" y="1582" width="1660" height="124" rx="14" class="card"/><text x="96" y="1611" class="ink tag">03 · W→O LIGATURE</text><text x="96" y="1638" class="muted small">C · HOLD</text><use href="#mark-c" transform="translate(748 1603) scale(.24)"/><use href="#mark-c" transform="translate(942 1597) scale(.36)"/><use href="#mark-c" transform="translate(1136 1591) scale(.48)"/><use href="#mark-c" transform="translate(1384 1579) scale(.72)"/>

<rect x="70" y="1730" width="1660" height="76" rx="14" fill="#142D31"/><text x="98" y="1762" fill="#D9F064" class="tag">DESK VERDICT · ADVANCE A FOR READABILITY; W→O IS THE FRESHEST MARK, STILL NEEDS OWNER DISTINCTIVENESS REVIEW.</text><text x="98" y="1787" fill="#fff" class="small">Recommendation: wordmark-first; do not ship a standalone mark yet. Arabic custom lettering remains deferred, not rejected or approved.</text>
</svg>
