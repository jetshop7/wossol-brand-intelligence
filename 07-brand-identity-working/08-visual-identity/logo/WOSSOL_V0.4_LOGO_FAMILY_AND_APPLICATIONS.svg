<title>WOSSOL V0.4 provisional logo family and applications</title><desc>Provisional wordmark-only logo recommendation shown in wide light and dark use and a conceptual merchant dashboard. No compact icon is selected. The sidebar uses a labelled temporary product W placeholder.</desc>
