<rect width="1800" height="1450" class="bg"/><text x="64" y="58" class="k muted">WOSSOL · V0.4 · WORDMARK REFINEMENT</text><text x="64" y="118" class="h1 ink">Clear Stroke, refined only where the comparison supports it.</text><text x="64" y="158" class="body muted">A / Clear Stroke remains the base. No new script, typeface, palette or decorative terminal was introduced.</text>
<rect x="64" y="208" width="1672" height="390" rx="20" class="card"/><text x="100" y="254" class="k muted">A0 · CLEAR STROKE / EXISTING VECTOR BASELINE</text><g transform="translate(110 310) scale(2.1)"><use href="#clear-stroke"/></g><text x="100" y="575" class="small muted">Original custom paths · rounded monoline · open counters · linked S rhythm.</text><text x="1420" y="575" class="xs" fill="#A93F32">OBSERVED RISK · S PAIR NEAR-COLLISION AT REDUCTION</text>
<rect x="64" y="626" width="1672" height="390" rx="20" class="card"/><text x="100" y="672" class="k muted">A1 · SINGLE CHANGE · OPEN THE SECOND S PAIR</text><g transform="translate(110 728) scale(2.1)"><use href="#clear-stroke-refined"/></g><text x="100" y="993" class="small muted">Right S + adjacent O/L shifted 10 units; stroke, W/O/L forms and rounded terminals retained.</text><text x="1400" y="993" class="xs ink">REFINEMENT · OPEN THE SS RHYTHM</text>
<rect x="64" y="1046" width="810" height="310" rx="20" class="dark"/><text x="100" y="1094" class="k lime">A1 · REVERSED / DARK</text><g transform="translate(112 1130) scale(1.05)"><use href="#clear-stroke-inverse"/></g><text x="100" y="1308" class="small paper">Warm Paper stroke on Night Field · no glow, outline or accent fill.</text><text x="100" y="1336" class="xs lime">VECTOR MASTER IS COLOR-INDEPENDENT</text>
<rect x="900" y="1046" width="836" height="310" rx="20" class="card"/><text x="936" y="1094" class="k muted">HEADER SCALE · A0 VS A1</text><g transform="translate(946 1132) scale(.72)"><use href="#clear-stroke"/></g><line x1="936" y1="1240" x2="1700" y2="1240" class="line"/><g transform="translate(946 1270) scale(.72)"><use href="#clear-stroke-refined"/></g>
<text x="64" y="1410" class="xs muted">DESK ASSESSMENT ONLY · NO MERCHANT RECOGNITION TEST, TRADEMARK REVIEW OR OWNER APPROVAL.</text>
