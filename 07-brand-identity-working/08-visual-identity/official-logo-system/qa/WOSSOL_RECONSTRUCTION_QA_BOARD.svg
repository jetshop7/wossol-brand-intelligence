<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740" role="img" aria-labelledby="title desc">
 <title id="title">WOSSOL Official Logo Master V1 — reference and vector comparison</title>
 <desc id="desc">Primary Refined reference crop compared beside the editable vector reconstruction. Includes enlarged symbol geometry and exact nominal symbol-width tests at 16, 24, 32, 48 and 64 SVG pixels on light, dark, black and white backgrounds.</desc>
 <defs>
