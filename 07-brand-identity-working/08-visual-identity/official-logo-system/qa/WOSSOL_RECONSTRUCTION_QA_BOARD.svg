 <text x="64" y="904" class="h2 ink">Nominal symbol-width tests · Light / Dark / Black / White</text><text x="64" y="934" class="small muted">Marks are drawn at the labelled SVG-unit width (aspect ratio preserved) inside equal comparison cells; individual raster exports are supplied.</text>
