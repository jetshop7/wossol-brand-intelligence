 <text x="64" y="1560" class="k muted">FIDELITY NOTE</text><text x="64" y="1592" class="small muted">The selected raster is low resolution and softly shaded. Symbol contours are manually redrawn; overlap highlight and gradients are interpreted approximations.</text><text x="64" y="1617" class="small muted">WOSSOL letterforms are custom editable vector strokes approximating the raster; the small tagline remains live Inter text. No pixel-perfect equivalence is claimed.</text><text x="64" y="1667" class="small ink">Owner review required: compare the editable master against the original crop before production approval.</text>
