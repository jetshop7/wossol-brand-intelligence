 <rect width="1800" height="1740" class="bg"/><text x="64" y="52" class="k muted">WOSSOL · OFFICIAL LOGO MASTER V1 · 2026-11-06</text><text x="64" y="104" class="h1 ink">Custom W Mark — Refined · raster-to-vector check</text><text x="64" y="139" class="body muted">Owner-selected artwork reconstruction · technical master remains pending owner visual approval.</text>
 <rect x="64" y="176" width="810" height="250" rx="16" class="card"/><text x="96" y="215" class="k muted">ORIGINAL · REF 03 / REFINED LOCKUP CROP</text><image href="../references/03a-refined-lockup-crop.png" x="120" y="250" width="680" height="170" preserveAspectRatio="xMidYMid meet"/>
