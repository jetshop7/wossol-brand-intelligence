<svg xmlns="http://www.w3.org/2000/svg" width="294" height="156" viewBox="0 0 147 78" role="img" aria-labelledby="title desc">
  <title id="title">WOSSOL Custom W Mark — Refined — Color</title>
  <desc id="desc">Editable geometric symbol traced from the selected raster reference. Two Harbor-green diagonal strokes and one ascending Lime stroke with a small translucent overlap highlight.</desc>
  <defs>
    <linearGradient id="harbor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2528"/><stop offset="1" stop-color="#153B3A"/></linearGradient>
    <clipPath id="middle-stroke"><path d="M66 19 Q62 13 69 10 L78 6 Q86 3 90 10 L123 70 Q127 77 120 81 L111 87 Q104 91 100 84 Z"/></clipPath>
  </defs>
  <g id="symbol-color" transform="translate(-6.44 -2.58) scale(.92 .86)">
    <path id="rising-lime-stroke" fill="#D7F06A" d="M96 67 L133 12 Q137 5 145 5 H155 Q162 5 165 12 Q167 17 163 22 L121 77 Q116 84 108 81 L100 77 Q92 74 96 67 Z"/>
    <path id="left-harbor-stroke" fill="url(#harbor)" d="M10 21 Q7 15 14 12 L24 8 Q31 5 35 12 L69 72 Q73 79 66 84 L57 90 Q50 94 46 86 Z"/>
    <path id="middle-harbor-stroke" fill="url(#harbor)" d="M66 19 Q62 13 69 10 L78 6 Q86 3 90 10 L123 70 Q127 77 120 81 L111 87 Q104 91 100 84 Z"/>
    <path id="source-overlap-highlight" d="M96 59 C100 52 108 49 115 53 C121 57 123 64 120 72 L115 79 C106 76 100 69 96 59 Z" fill="#D7F06A" fill-opacity=".48" clip-path="url(#middle-stroke)"/>
  </g>
</svg>
