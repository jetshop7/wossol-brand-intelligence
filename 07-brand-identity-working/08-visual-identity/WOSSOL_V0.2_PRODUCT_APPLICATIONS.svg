<rect x="116" y="2665" width="375" height="290" rx="24" fill="#0E2528"/><rect x="130" y="2680" width="347" height="260" rx="16" class="paper"/><rect x="130" y="2680" width="347" height="54" rx="15" fill="#153B3A"/><use xlink:href="#wordmarkLight" transform="translate(148 2691) scale(.24)"/><text x="147" y="2760" class="tiny muted">CATALOG · FAVORITES</text><text x="147" y="2791" class="h3 ink">Browse products</text><rect x="147" y="2810" width="313" height="90" rx="10" class="card"/><rect x="159" y="2822" width="69" height="65" rx="8" class="mist"/><text x="242" y="2848" class="small ink">Product name</text><text x="242" y="2875" class="tiny muted">SYNTHETIC SAMPLE</text><rect x="147" y="2910" width="313" height="24" rx="6" class="lime"/>
<text x="525" y="2705" class="tiny coral">NOT AN IMPLEMENTED APP SCREEN</text><text x="525" y="2750" class="bodyt body">Responsive grid classes are present in source;</text><text x="525" y="2781" class="bodyt body">the client header has no verified small-screen</text><text x="525" y="2812" class="bodyt body">collapse. No browser/device runtime capture</text><text x="525" y="2843" class="bodyt body">was available. Validate nav wrapping before use.</text><text x="525" y="2910" class="small muted">No native mobile application route was found.</text>

<rect x="1050" y="2550" width="1270" height="440" rx="22" class="night"/><text x="1090" y="2595" fill="#D7F06A" class="tiny">NO USER-FACING ROUTE FOUND IN THE INSPECTED BRANCH</text>
