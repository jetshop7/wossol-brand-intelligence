<text x="1090" y="2740" class="white h3">Inventory</text><text x="1090" y="2773" fill="#D8E3DE" class="small">No user-facing route found; not mocked.</text><line x1="1090" y1="2794" x2="2265" y2="2794" stroke="#35504E" stroke-width="2"/>
<text x="1090" y="2836" class="white h3">Advertising / Analytics</text><text x="1090" y="2869" fill="#D8E3DE" class="small">`/admin/marketing` is market-study/report tooling, not an ad console.</text><text x="1090" y="2915" fill="#B9CBC5" class="small">Backend capability outside this UI tree remains unverified.</text>

